name: MVP tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Validate dashboard JavaScript syntax
        run: |
          python -c "from pathlib import Path; s = Path('web/index.html').read_text(); Path('/tmp/aervigia-inline.js').write_text(s.split('<script>', 1)[1].split('</script>', 1)[0])"
          node --check /tmp/aervigia-inline.js
      - name: Run automated tests
        run: python -m pytest -q
      - name: Build Docker image and smoke-test local API
        run: |
          set -euo pipefail
          docker build -t aervigia-ci .
          docker run -d --name aervigia-ci-test \
            -p 127.0.0.1:18000:8000 \
            -e AERVIGIA_DB_PATH=/app/data/events.sqlite3 \
            -e AERVIGIA_VIEW_TOKEN=ci-view-only-token \
            aervigia-ci
          trap 'docker logs aervigia-ci-test || true; docker rm -f aervigia-ci-test || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/api/state)" = "401"
          curl -fsS -H 'X-View-Key: ci-view-only-token' http://127.0.0.1:18000/api/state
          docker exec aervigia-ci-test test -f /app/data/events.sqlite3
      - name: Smoke-test named identities in Docker
        run: |
          set -euo pipefail
          docker run -d --name aervigia-named-ci \
            -p 127.0.0.1:18001:8000 \
            -e AERVIGIA_DB_PATH=/app/data/events.sqlite3 \
            -e AERVIGIA_USERS_FILE=/app/data/users.json \
            aervigia-ci
          trap 'docker logs aervigia-named-ci || true; docker rm -f aervigia-named-ci || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18001/healthz >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer abcdefghijklmnopqrstuvwxyz1234567890' http://127.0.0.1:18001/api/state)" = "503"
          VIEWER_TOKEN="$(docker exec aervigia-named-ci python -m aervigia.auth --file /app/data/users.json add --user ciViewer --role viewer | tail -n 1)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18001/api/state)" = "401"
          curl -fsS -H "Authorization: Bearer ${VIEWER_TOKEN}" http://127.0.0.1:18001/api/me
          curl -fsS -H "Authorization: Bearer ${VIEWER_TOKEN}" http://127.0.0.1:18001/api/state >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${VIEWER_TOKEN}" http://127.0.0.1:18001/api/simulation/reset)" = "403"
          docker exec aervigia-named-ci python -m aervigia.auth --file /app/data/users.json revoke --user ciViewer
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${VIEWER_TOKEN}" http://127.0.0.1:18001/api/state)" = "401"
